services:
  aegis-api:
    build: .
    image: aegis-enterprise-stress-lab:local
    ports:
      - "8088:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      AEGIS_AUTH_SECRET: "local-docker-demo-secret-change-before-production"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  aegis-worker:
    build: .
    image: aegis-enterprise-stress-lab:local
    command: ["node", "apps/worker/src/main.mjs"]
    profiles: ["worker"]
    stdin_open: true
    environment:
      NODE_ENV: production
