apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-api
  namespace: aegis-stress-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-api
  template:
    metadata:
      labels:
        app: aegis-api
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/aegis-enterprise-stress-lab:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aegis-api-config
          env:
            - name: AEGIS_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: aegis-api-secrets
                  key: auth-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
